# Configuración por defecto de bin/fedora-maintenance.
# Precedencia: este archivo < /etc/fedora-maintenance.conf < archivo del usuario
# (~/.config/fedora-maintenance/config) < opciones de línea de comandos.

AUTO_REBOOT=false
UPDATE_FLATPAK=true
UPDATE_FIRMWARE=true
OFFLINE_UPDATE=false
REMOVE_ORPHANS=true
CLEAN_CACHE=true
LOG_RETENTION=15
ENABLE_SNAPSHOTS=true
SNAPSHOT_DIR="/.snapshots/fedora-maintenance"
CHECK_INTERNET=true
STATUS_TIMEOUT=20
